viash_version: 0.9.7

source: src
target: target

name: openpipeline_models
organization: openpipelines-bio

links:
  repository: https://github.com/openpipelines-bio/openpipeline_models
  docker_registry: ghcr.io

repositories:
  - name: openpipeline
    repo: openpipeline
    type: vsh
    tag: v4.2.0

info:
  test_resources:
    - type: s3
      path: s3://openpipelines-data
      dest: resources_test
  nextflow_labels_ci:
    - path: src/workflows/utils/labels_ci.config
      description: Adds the correct memory and CPU labels when running on the Viash Hub CI.

config_mods: |
  .resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}
  .runners[.type == 'nextflow'].config.script := 'includeConfig("nextflow_labels.config")'